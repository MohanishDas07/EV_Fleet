apiVersion: apps/v1
kind: Deployment
metadata:
  name: voltgrid-iot-service
  labels:
    app: voltgrid-iot
spec:
  replicas: 3 # Auto-scale based on HPA
  selector:
    matchLabels:
      app: voltgrid-iot
  template:
    metadata:
      labels:
        app: voltgrid-iot
    spec:
      containers:
      - name: iot-service
        image: voltgrid/iot-service:latest
        ports:
        - containerPort: 3001
        env:
        - name: MQTT_URL
          valueFrom:
            secretKeyRef:
              name: voltgrid-secrets
              key: mqtt-url
---
apiVersion: v1
kind: Service
metadata:
  name: voltgrid-iot-service
spec:
  type: LoadBalancer
  selector:
    app: voltgrid-iot
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
